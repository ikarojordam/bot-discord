<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email confirmado — Frio Panel</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="stylesheet" href="/assets/style.css?v=8">
<style>
.confirm-page{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:20px;background:#05060a;overflow:hidden;
}
.confirm-page .aurora{position:absolute;inset:0}
.confirm-card{
  position:relative;z-index:1;
  max-width:460px;width:100%;
  background:var(--glass);backdrop-filter:blur(24px);
  border:1px solid var(--glass-border);
  border-radius:24px;padding:48px 40px;text-align:center;
  box-shadow:var(--shadow-lg);
  animation:card-enter .6s cubic-bezier(.22,1,.36,1);
}
.confirm-icon{
  width:96px;height:96px;border-radius:50%;
  margin:0 auto 24px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(34,197,94,.2),rgba(22,163,74,.15));
  border:2px solid rgba(34,197,94,.4);
  font-size:52px;
  box-shadow:0 0 50px rgba(34,197,94,.35);
  animation:pop-in .5s cubic-bezier(.34,1.56,.64,1) .1s both;
}
@keyframes pop-in{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.confirm-card h1{
  font-size:26px;font-weight:800;margin-bottom:12px;
  background:linear-gradient(135deg,#fff,#86efac);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.confirm-card p{color:var(--txt-2);font-size:15px;line-height:1.6;margin-bottom:28px}
.confirm-btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 28px;border-radius:13px;border:none;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#fff;font-size:15px;font-weight:700;
  cursor:pointer;text-decoration:none;
  box-shadow:0 6px 22px rgba(34,197,94,.4);
  transition:all .25s;
}
.confirm-btn:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(34,197,94,.55);text-decoration:none}
.confirm-timer{margin-top:20px;font-size:13px;color:var(--txt-3)}
.confirm-timer b{color:#4ade80}
</style>
</head>
<body>

<div class="confirm-page">
  <div class="aurora">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="confirm-card">
    <div class="confirm-icon">✅</div>
    <h1>Email confirmado!</h1>
    <p>Sua conta foi verificada com sucesso.<br>Agora você já pode fazer login no painel.</p>
    <a href="/" class="confirm-btn">🚀 Ir para o painel</a>
    <div class="confirm-timer">Redirecionando em <b id="timer">5</b>s…</div>
  </div>
</div>

<script>
// Redireciona em 5s
let s = 5;
const t = document.getElementById('timer');
const id = setInterval(() => {
  s--;
  if (t) t.textContent = s;
  if (s <= 0) { clearInterval(id); window.location.href = '/'; }
}, 1000);
</script>
</body>
</html>
