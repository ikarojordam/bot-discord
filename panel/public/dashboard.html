<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frio Panel — Dashboard</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="app-page">
<header class="topbar">
  <div class="topbar-left">
    <div class="logo-sm">🧊</div>
    <strong>Frio Panel</strong>
  </div>
  <div class="topbar-right">
    <span id="userEmail" class="user-email"></span>
    <button id="btnLogout" class="btn-ghost">Sair</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="generate">🔑 Gerar Keys</button>
  <button class="tab" data-tab="list">📋 Listar Keys</button>
  <button class="tab" data-tab="redemptions">🎁 Resgates</button>
  <button class="tab" data-tab="admins" id="tabAdmins" style="display:none">👥 Admins</button>
</nav>

<main class="content">

  <section id="tab-generate" class="tab-panel active">
    <h2>Gerar Keys Premium</h2>
    <form id="genForm" class="card">
      <div class="grid-2">
        <div class="field">
          <label>Tier</label>
          <select id="tier" required>
            <option value="basic">🥉 Basic</option>
            <option value="premium" selected>🥈 Premium</option>
            <option value="ultra">🥇 Ultra</option>
            <option value="unlimited">💎 Unlimited</option>
          </select>
        </div>
        <div class="field">
          <label>Duração</label>
          <select id="duracao" required>
            <option value="7">7 dias</option>
            <option value="15">15 dias</option>
            <option value="30" selected>30 dias</option>
            <option value="90">90 dias</option>
            <option value="180">180 dias</option>
            <option value="365">1 ano</option>
            <option value="0">Permanente</option>
          </select>
        </div>
        <div class="field">
          <label>Quantidade (1-50)</label>
          <input type="number" id="qtd" value="1" min="1" max="50">
        </div>
        <div class="field">
          <label>Máx. usos por key</label>
          <input type="number" id="maxUsos" value="1" min="1" max="100">
        </div>
        <div class="field">
          <label>Validade da key (dias) — 0 = sem</label>
          <input type="number" id="validade" value="0" min="0">
        </div>
        <div class="field">
          <label>Motivo (opcional)</label>
          <input type="text" id="motivo" placeholder="Ex: Parceria com X">
        </div>
      </div>
      <button type="submit" id="btnGerar">Gerar Keys</button>
      <div id="genResult" class="result-box"></div>
    </form>
  </section>

  <section id="tab-list" class="tab-panel">
    <h2>Keys Geradas</h2>
    <div class="filters">
      <select id="filterStatus">
        <option value="">Todas</option>
        <option value="active">Só ativas</option>
        <option value="used">Só esgotadas</option>
      </select>
      <select id="filterTier">
        <option value="">Todos os tiers</option>
        <option value="basic">Basic</option>
        <option value="premium">Premium</option>
        <option value="ultra">Ultra</option>
        <option value="unlimited">Unlimited</option>
      </select>
      <button id="btnRefresh">🔄 Atualizar</button>
    </div>
    <div id="keysTable" class="table-wrap"></div>
  </section>

  <section id="tab-redemptions" class="tab-panel">
    <h2>Histórico de Resgates</h2>
    <div id="redemptionsTable" class="table-wrap"></div>
  </section>

  <section id="tab-admins" class="tab-panel">
    <h2>Administradores do Painel</h2>
    <div class="card">
      <h3>Adicionar admin</h3>
      <p class="hint">A pessoa precisa ter criado conta no site antes.</p>
      <form id="addAdminForm">
        <div class="grid-2">
          <div class="field">
            <label>E-mail</label>
            <input type="email" id="adminEmail" required>
          </div>
          <div class="field">
            <label>Nome</label>
            <input type="text" id="adminNome">
          </div>
          <div class="field checkbox">
            <label><input type="checkbox" id="adminPodeGerar"> Pode gerar keys</label>
          </div>
        </div>
        <button type="submit">Adicionar</button>
      </form>
    </div>
    <div id="adminsTable" class="table-wrap"></div>
  </section>

</main>

<script src="/assets/app.js"></script>
</body>
</html>
