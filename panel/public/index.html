<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Debug Frio Panel</title>
<style>
body{font-family:monospace;background:#0f1115;color:#e8eaed;padding:16px;font-size:13px}
h1{color:#5865F2;margin-bottom:12px;font-size:18px}
button{padding:12px 20px;background:#5865F2;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;margin:4px 0;width:100%}
input{width:100%;padding:12px;background:#2b2d31;color:#fff;border:1px solid #3f4147;border-radius:8px;font-size:15px;margin:4px 0}
.box{background:#1e1f22;border:1px solid #2b2d31;border-radius:8px;padding:12px;margin:8px 0;white-space:pre-wrap;word-break:break-all}
.ok{color:#4ade80;border-left:3px solid #22c55e}
.err{color:#f87171;border-left:3px solid #ef4444}
.info{color:#a5b4fc;border-left:3px solid #5865F2}
.warn{color:#fbbf24;border-left:3px solid #fbbf24}
.label{color:#949BA4;font-size:11px;text-transform:uppercase;margin-top:12px}
</style>
</head>
<body>
<h1>🔍 Debug Frio Panel</h1>

<div class="label">1) Estado atual</div>
<div id="state" class="box info">Carregando…</div>

<div class="label">2) Testar login</div>
<input type="email" id="email" placeholder="E-mail" value="ikarojordam57@gmail.com">
<input type="password" id="pass" placeholder="Senha">
<button onclick="testarLogin()">▶ Testar Login</button>

<div id="log"></div>

<button onclick="limpar()" style="background:#ED4245;margin-top:20px">🗑️ Limpar localStorage + Cookie</button>

<script>
const log = (msg, cls = 'info') => {
  document.getElementById('log').innerHTML += `<div class="box ${cls}">${msg}</div>`;
};

const mostrarEstado = () => {
  const token = localStorage.getItem('sb_token');
  const cookies = document.cookie;
  document.getElementById('state').innerHTML = 
    `localStorage.sb_token: ${token ? '✅ ' + token.slice(0,40) + '...' : '❌ VAZIO'}\n` +
    `document.cookie: ${cookies || '(vazio)'}`;
};
mostrarEstado();

async function testarLogin() {
  document.getElementById('log').innerHTML = '';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('pass').value;
  
  log('▶ POST /api/auth/login...', 'info');
  
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, password }),
    });
    
    log(`Status HTTP: ${r.status}`, r.ok ? 'ok' : 'err');
    log(`Set-Cookie recebido: ${r.headers.get('set-cookie') || '(nenhum)'}`, 'info');
    
    const j = await r.json().catch(() => ({}));
    log(`Resposta JSON:\n${JSON.stringify(j, null, 2).slice(0, 800)}`, r.ok ? 'ok' : 'err');
    
    if (j.token) {
      localStorage.setItem('sb_token', j.token);
      log(`✅ Token salvo no localStorage`, 'ok');
      mostrarEstado();
      
      // Testa endpoints protegidos
      log('▶ Testando /api/auth/me com o token...', 'info');
      const r2 = await fetch('/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + j.token },
        credentials: 'include',
      });
      const j2 = await r2.json().catch(() => ({}));
      log(`Status: ${r2.status}\n${JSON.stringify(j2, null, 2).slice(0, 600)}`, r2.ok ? 'ok' : 'err');
      
      if (r2.ok) {
        log('✅ TUDO OK! Pode voltar pro painel.', 'ok');
      } else {
        log('❌ Falha no /api/auth/me mesmo com token. Print isso pro dev.', 'err');
      }
    } else {
      log('⚠️ Login NÃO retornou token. Server pode estar em versão antiga.', 'warn');
    }
  } catch (e) {
    log(`❌ Erro de fetch: ${e.message}`, 'err');
  }
}

function limpar() {
  localStorage.clear();
  document.cookie.split(';').forEach(c => {
    document.cookie = c.replace(/^ +/, '').replace(/=.*/, '=;expires=' + new Date().toUTCString() + ';path=/');
  });
  alert('Limpo! Recarregue a página.');
  location.reload();
}
</script>
</body>
</html>
