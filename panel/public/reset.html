<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frio Panel — Nova senha</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="auth-page">
<div class="auth-card">
  <div class="logo">🔐</div>
  <h1>Nova senha</h1>
  <p class="sub">Digite sua nova senha abaixo</p>

  <form id="resetForm">
    <div class="field">
      <label>Nova senha</label>
      <input type="password" id="newPassword" required minlength="8">
    </div>
    <div class="field">
      <label>Confirmar senha</label>
      <input type="password" id="confirmPassword" required minlength="8">
    </div>
    <button type="submit" id="btnReset">Salvar nova senha</button>
  </form>

  <div id="msg" class="msg"></div>
</div>

<script>
  // O Supabase coloca o token no hash (#access_token=...)
  const hash = new URLSearchParams(window.location.hash.substring(1));
  window.__RESET_TOKEN__ = hash.get('access_token');
</script>
<script src="/assets/app.js"></script>
</body>
</html>
